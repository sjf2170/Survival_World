<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Crafting Recipes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h2>Crafting Recipes</h2>
   <h3>Discovered Resources</h3>
  <input id="itemInput" type="text" placeholder="Type to search items...">
  <div id="inventory"></div>

  <h3>Craftable Items</h3>
  <ul id="craftable-list"></ul>

  <section id="tool-selection">
    <h3>Available Tools</h3>
    <form id="tools-form">
      <label><input type="checkbox" name="tools" value="Fabricator"> Fabricator</label>
      <label><input type="checkbox" name="tools" value="Modification Station"> Modification Station</label>
      <label><input type="checkbox" name="tools" value="Habitat Builder"> Habitat Builder</label>
      <label><input type="checkbox" name="tools" value="Mobile Vehicle Bay"> Mobile Vehicle Bay</label>
      <label><input type="checkbox" name="tools" value="Moonpool"> Moonpool</label>
      <label><input type="checkbox" name="tools" value="Cyclops"> Cyclops</label>
    </form>
  </section>

  <script src="script.js"></script>
</body>
</html>
